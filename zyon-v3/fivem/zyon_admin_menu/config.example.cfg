# Use o grupo administrativo que ja existe na configuracao ACE do servidor.
add_ace group.admin zyon.modmenu allow

# Obrigatorio se aplicativo e FXServer estiverem em computadores diferentes.
# URL completa do recurso, sem credenciais, com certificado HTTPS confiavel.
# set zyon_menu_public_url "https://admin.example.com/zyon_admin_menu/"

# Detecta o sistema medico separadamente em cada servidor.
# Valores: auto, standalone, esx, qbcore.
set zyon_menu_medical_provider "auto"

# Se o seu QBCore utiliza outro principal ACE, adapte a linha add_ace acima
# ao principal administrativo existente, por exemplo qbcore.admin.
ensure zyon_admin_menu
